apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "keycloak.selectorLabels" . | nindent 4 }}
  type: {{ .Values.service.type }}
---
{{- if .Values.discoveryService.enabled }}
# Headless Service used as the StatefulSet serviceName so pods get stable
# DNS names for JGroups discovery.
apiVersion: v1
kind: Service
metadata:
  labels:
    app: keycloak
  name: {{ include "keycloak.discoveryServiceName" . }}
spec:
  selector:
    app: keycloak
  clusterIP: None
  type: ClusterIP
{{- end }}
