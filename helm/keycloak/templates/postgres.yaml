{{- if .Values.postgres.enabled }}
# This is deployment of PostgreSQL with a ephemeral storage for testing: Once the Pod stops, the data is lost.
# For a production setup, replace it with a database setup that persists your data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag | default .Values.postgres.image.tag }}"
          {{- with .Values.postgres.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_LOG_STATEMENT
              value: {{ .Values.postgres.logStatement | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.postgres.storage.enabled }}
            # Using a persistent volume for PostgreSQL's data folder so data
            # survives pod restarts.
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            {{- else }}
            # Using volume mount for PostgreSQL's data folder as it is otherwise not writable
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            {{- end }}
      volumes:
        {{- if .Values.postgres.storage.enabled }}
        - name: postgres-data
          persistentVolumeClaim:
            accessModes: ["ReadWriteOnce"]
            {{- with .Values.postgres.storage.class }}
            storageClassName: {{ . }}
            {{- end }}
            resources:
              requests:
                storage: {{ .Values.postgres.storage.size }}
        {{- else }}
        - name: postgres-data
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: postgres
  name: postgres
  {{- with .Values.postgres.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: {{ .Values.postgres.service.port }}
      targetPort: 5432
  type: ClusterIP
{{- end }}
