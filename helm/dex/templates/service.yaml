apiVersion: v1
kind: Service
metadata:
  name: {{ include "dex.fullname" . }}
  labels:
    {{- include "dex.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # -- ClusterIP keeps Dex reachable from every namespace/pod via
  #     dex.<namespace>.svc.cluster.local:<port>
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "dex.selectorLabels" . | nindent 4 }}
