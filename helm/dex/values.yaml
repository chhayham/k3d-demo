https:
  # -- Enable the HTTPS endpoint.
  enabled: false # terminate at traefik

grpc:
  # -- Enable the gRPC endpoint.
  # Read more in the [documentation](https://dexidp.io/docs/api/).
  enabled: false

configSecret:
  # -- Enable creating a secret from the values passed to `config`.
  # If set to false, name must point to an existing secret.
  create: true

  # -- The name of the secret to mount as configuration in the pod.
  # If not set and create is true, a name is generated using the fullname template.
  # Must point to secret that contains at least a `config.yaml` key.
  name: ""

# -- Application configuration.
# See the [official documentation](https://dexidp.io/docs/).
config:
  # Set it to a valid URL
  issuer: https://dex.localhost

  # See https://dexidp.io/docs/storage/ for more options
  storage:
    type: memory

  # Enable at least one connector
  # See https://dexidp.io/docs/connectors/ for more options
  enablePasswordDB: true
  
  web:
    http: https://dex.localhost
  
  connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: "Iv23liFQMxQyM7HIMULO"
      clientSecret: "589cd9df80ee8fa008c8567e51c7cf2d86ba1eb1"
      redirectURI: https://dex.localhost/dex/callback
      loadAllGroups: true
      teamNameField: slug
  
  staticClients:
    - id: argocd
      name: "Argo CD"
      secret: cGFzc3dvcmQ= # Replace with a secure secret
      redirectURIs:
        - "http://argocd-server.argocd:8080/auth/callback" # Replace with your actual Argo CD URL

  #   - id: headlamp
  #     redirectURIs:
  #       - 'http://headlamp.headlmap:8080/oidc-callback'
  #     name: 'Headlamp'
  #     secret: ZXhhbXBsZS1hcHAtc2VjcmV0

httpRoute:
  # -- Enable Gateway API HTTPRoute.
  # Gateway API support is in EXPERIMENTAL status. Support depends on your Gateway controller implementation.
  # See the [Gateway API documentation](https://gateway-api.sigs.k8s.io/) for details.
  enabled: true

  # -- Annotations to be added to the HTTPRoute.
  annotations: {}

  # -- References to the Gateway(s) that this HTTPRoute is attached to.
  # See the [API reference](https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.ParentReference) for details.
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure

  # -- Hostnames defines the hostnames for routing.
  # See the [API reference](https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.Hostname) for details.
  hostnames:
    - dex.localhost

  # -- HTTPRoute rules configuration.
  # See the [API reference](https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.HTTPRouteRule) for details.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # filters:
      #   - type: RequestHeaderModifier
      #     requestHeaderModifier:
      #       add:
      #         - name: X-Custom-Header
      #           value: custom-value
serviceMonitor:
  # -- Enable Prometheus ServiceMonitor.
  # See the [documentation](https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/design.md#servicemonitor) and the [API reference](https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md#servicemonitor) for details.
  enabled: true