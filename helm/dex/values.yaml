# Default values for dex.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/dexidp/dex
  # -- Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
  # -- Optional image pull secrets, e.g. for private registries.
  pullSecrets: []

serviceAccount:
  annotations: {}

# -- Public issuer URL. This is the base URL used in the Dex config `issuer`
#    field and is what external clients (browsers, Argo CD, Headlamp) see.
#    Must be reachable through Traefik (see `httpRoute`).
issuer:
  url: "https://dex.localhost/dex"

# -- Cluster-internal issuer URL. In-cluster clients (Argo CD, Headlamp, other
#    pods) can use this to talk to Dex directly, bypassing the Traefik proxy.
#    Format: http://dex.<namespace>.svc.cluster.local:<port>/dex
internalUrl: "http://dex.dex.svc.cluster.local:5556/dex"

service:
  # -- ClusterIP keeps Dex reachable from every namespace and pod in the
  #    cluster via its service DNS name.
  type: ClusterIP
  # -- Port Dex listens on (web.http) and the Service exposes.
  port: 5556
  annotations: {}

# -- Optional Prometheus metrics endpoint for Dex.
enableTelemetry: true
telemetry:
  port: 5558

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
#  runAsNonRoot: true
#  runAsUser: 65532
#  fsGroup: 65532

securityContext: {}
#  allowPrivilegeEscalation: false
#  capabilities:
#    drop:
#      - ALL

resources: {}
#  limits:
#    cpu: 200m
#    memory: 256Mi
#  requests:
#    cpu: 50m
#    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

dex:
  # -- GitHub OIDC connector.
  #    Create an OAuth App at https://github.com/settings/developers and set
  #    the "Authorization callback URL" to `<issuer.url>/callback`
  #    (default: https://dex.localhost/dex/callback).
  github:
    enabled: true
    clientId: "your-github-client-id"
    clientSecret: "your-github-client-secret"
    # -- Change only if you run a GitHub Enterprise instance.
    baseURL: "https://github.com"

  # -- Pre-registered OIDC clients. These id/secret pairs are the ones
  #    Argo CD and Headlamp use to authenticate users against Dex.
  #    The secrets here are the raw values (not base64) — Dex expects them
  #    as plain strings in its config.
  staticClients:
    - id: "argocd"
      name: "Argo CD"
      secret: "argocd-client-secret"
    - id: "headlamp"
      name: "Headlamp"
      # -- Matches the value already used in argocd/applications/headlamp.yaml
      secret: "ZXhhbXBsZS1hcHAtc2VjcmV0"

  # -- Escape hatch: append extra connectors (ldap, saml, microsoft, ...) to
  #    the generated Dex config. Must be a valid list of connector definitions.
  extraConnectors: []
  #  - type: ldap
  #    id: ldap
  #    name: LDAP
  #    config:
  #      host: "ldap.example.com:389"
  #      ...

# -- Gateway API HTTPRoute. Routes HTTPS traffic from Traefik to the Dex
#    Service. TLS termination happens CENTRALLY at the Gateway (Traefik
#    `websecure` listener) using the shared *.localhost wildcard cert
#    (localhost-tls, produced by cert-manager via
#    manifests/traefik/certificate.yaml). This chart intentionally does NOT
#    create a per-service Certificate.
httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "dex.localhost"
  # -- Optional HTTPRoute filters.
  filters: []