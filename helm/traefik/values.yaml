# Configure Network Ports and EntryPoints
# EntryPoints are the network listeners for incoming traffic.
ports:
  # Defines the HTTP entry point named 'web'
  web:
    port: 80
    nodePort: 30000
    # # Instructs this entry point to redirect all traffic to the 'websecure' entry point
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
    #       permanent: true

  # Defines the HTTPS entry point named 'websecure'
  websecure:
    port: 443
    nodePort: 30001
  
  # tcp:
  #   port: 8443
  

# Enables the dashboard in Secure Mode
api:
  dashboard: true
  insecure: false

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`dashboard.localhost`)
    entryPoints:
      - websecure
    middlewares:
      - name: dashboard-auth

# Creates a BasicAuth Middleware and Secret for the Dashboard Security
extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-auth-secret
    type: kubernetes.io/basic-auth
    stringData:
      username: admin
      password: "admin"      # Replace with an Actual Password
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: dashboard-auth
    spec:
      basicAuth:
        secret: dashboard-auth-secret

# We will route with Gateway API instead.
ingressClass:
  enabled: false

# Enable Gateway API Provider & Disables the KubernetesIngress provider
# Providers tell Traefik where to find routing configuration.
providers:
  kubernetesCRD:
    enabled: true
    allowExternalNameServices: false
    namespaces: []
    safeNaming: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

## Gateway Listeners
gateway:
  listeners:
    web:           # HTTP listener that matches entryPoint `web`
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All

    websecure:         # HTTPS listener that matches entryPoint `websecure`
      port: 443
      protocol: HTTPS  # TLS terminates inside Traefik
      namespacePolicy:
        from: All
      mode: Terminate
      # Shared wildcard TLS for EVERY service routed through Traefik.
      # `localhost-tls` is produced by cert-manager via the single source of
      # truth in manifests/traefik/certificate.yaml (Certificate
      # `traefik-localhost-tls`, dnsNames: *.localhost). Per-service certs are
      # intentionally not used; each service only adds an HTTPRoute hostname.
      certificateRefs:
        - kind: Secret
          name: localhost-tls
          group: ""

    # tcp:
    #   protocol: TCP
    #   port: 8443
    #   allowedRoutes:
    #     kinds:
    #       - kind: TCPRoute

    # dex-passthrough:
    #   port: 443
    #   protocol: HTTPS
    #   hostname: "dex.localhost"
    #   tls:
    #     mode: Passthrough # Crucial: Tells Traefik to forward raw encrypted stream
    #   certificateRefs:    
    #     - kind: Secret 
    #       name: localhost-tls
    #       group: "" 
    #   allowedRoutes:
    #     kinds:
    #       - kind: IngressRouteTCP # Instructs the listener to bind TLSRoutes
    #     namespaces:
    #       from: All

# Enable Observability
log:
  level: INFO
# This enables access logs, outputting them to Traefik's standard output by default. The [Access Logs Documentation](https://doc.traefik.io/traefik/observability/access-logs/) covers formatting, filtering, and other fields.
accessLog:
  enabled: true

# Enables Prometheus for Metrics
metrics:
  prometheus:
    enabled: true

