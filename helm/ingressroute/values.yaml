# Default values for the ingressroute chart.
#
# This chart renders Traefik IngressRoute resources (traefik.io/v1alpha1).
# Define one entry per IngressRoute you want to create. The defaults below
# reproduce the manifests that previously lived in manifests/ingressroute-*.yaml.

# The apiVersion used for all rendered IngressRoute resources.
apiVersion: traefik.io/v1alpha1

# List of IngressRoute resources to create.
ingressRoutes:
  # Argo CD server
  - name: argocd-server
    namespace: argocd
    hostname: argocd.localhost
    entryPoints:
      - web
    services:
      - name: argocd-server
        port: 80

  # Kargo API
  - name: kargo-api
    namespace: kargo
    hostname: kargo.localhost
    entryPoints:
      - web
    services:
      - name: kargo-api
        port: 80

  # Monitoring: Prometheus
  - name: kube-prometheus-stack-prometheus
    namespace: monitoring
    hostname: monitoring.localhost
    entryPoints:
      - web
    services:
      - name: kube-prometheus-stack-prometheus
        port: 9090

  # Monitoring: Grafana
  - name: kube-prometheus-stack-grafana
    namespace: monitoring
    hostname: grafana.localhost
    entryPoints:
      - web
    services:
      - name: kube-prometheus-stack-grafana
        port: 80

  # Monitoring: Alertmanager
  - name: kube-prometheus-stack-alertmanager
    namespace: monitoring
    hostname: alertmanager.localhost
    entryPoints:
      - web
    services:
      - name: kube-prometheus-stack-alertmanager
        port: 9093
