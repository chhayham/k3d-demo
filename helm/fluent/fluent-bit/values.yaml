config:
  outputs: |
    [OUTPUT]
        Name                   loki
        Match                  *
        Host                   loki
        Port                   3100
        Labels                 job=fluent-bit,agent=fluent-bit
        Label_Keys             $sub['stream']
        Auto_Kubernetes_Labels on
        Line_Format            json
        Retry_Limit            5 
        Tenant_ID              demo 

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  # - name: etcmachineid
  #   hostPath:
  #     path: /etc/machine-id
  #     type: File

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  # - name: etcmachineid
  #   mountPath: /etc/machine-id
  #   readOnly: true
