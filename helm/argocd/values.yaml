dex:
  enabled: true #false
      
notifications:
  enabled: false

global:
  domain: "argocd.localhost"

server:
  # service: 
  #   annotations: 
  #     traefik.ingress.kubernetes.io/service.serverstransport: argocd-argocd-transport@kubernetescrd
  certificate:
    enabled: true
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: selfsigned-cluster-issuer
  #   additionalHosts:
  #     - 127.0.0.1
  #     - 0.0.0.0
  extensions:
    enabled: true
    extensionList:
      - name: argo-rollouts
        env:
          - name: EXTENSION_URL
            value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.3.7/extension.tar 

  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        sectionName: websecure
    hostnames: 
      - argocd.localhost

  backendTLSPolicy:
    enabled: true
    targetRefs:
      - group: ""
        kind: Service
        name: argocd-server
        sectionName: https
    validation:
      hostname: "argocd.localhost"
      wellKnownCACertificates: "System"
  
