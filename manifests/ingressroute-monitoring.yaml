apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-prometheus-stack-prometheus
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`monitoring.localhost`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
--- 
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-prometheus-stack-grafana
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.localhost`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
--- 
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-prometheus-stack-alertmanager
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`alertmanager.localhost`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-alertmanager
          port: 9093