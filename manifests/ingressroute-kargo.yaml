apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo-api
  namespace: kargo
spec:
  parentRefs:
    - name: traefik-gateway # Name of the Gateway that Traefik creates when you enable the Gateway API provider
      sectionName: websecure
      namespace: traefik
  hostnames:
    - "kargo.localhost"
  rules:
    - backendRefs:
      - name: kargo-api
        port: 80