apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  source:
    chart: harbor
    repoURL: https://helm.goharbor.io
    targetRevision: 1.19.2
    helm:
      releaseName: harbor
      parameters:
       - name: "expose.type"
         value: nodePort 
       - name: "expose.nodePort.ports.http.nodePort"
         value: "30002"
       - name: "expose.nodePort.ports.https.nodePort"
         value: "30003"
       - name: "harborAdminPassword"
         value: admin
       - name: "expose.tls.auto.commonName"
         value: "localhost"
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
