apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  source:
    chart: harbor
    repoURL: https://helm.goharbor.io
    targetRevision: 2.15.0
    helm:
      releaseName: harbor
      valuesObject:
        service:
          type: NodePort
          port: 80
          nodePort: 31301
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
    syncOptions:
      - CreateNamespace=true