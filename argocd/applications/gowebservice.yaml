apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gowebservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chhayham/GoWebService
    path: helm-chart
    targetRevision: v1.0.4
    helm:
      releaseName: gowebservice
      valuesObject:
        service:
          type: NodePort
          port: 8080
          nodePort: 31080
  destination:
    server: "https://kubernetes.default.svc"
    namespace: gowebservice
  syncPolicy:
    syncOptions:
    - CreateNamespace=true