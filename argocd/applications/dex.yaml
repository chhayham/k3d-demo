apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
spec:
  project: default
  source:
    chart: dex
    repoURL: https://charts.dexidp.io
    targetRevision: 0.24.1
    helm:
      releaseName: dex
      valuesObject:
        https:
          # -- Enable the HTTPS endpoint.  Requires certs
          enabled: false
        service:
          type: NodePort
          ports:
            http:
              nodePort: 30056
            https:
              nodePort: 30054
            grpc:
              nodePort: 30057

        serviceMonitor:
          enabled: true

        config:
          issuer: http://127.0.0.1:5556/dex

          storage:
            type: kubernetes
            config:
              inCluster: true

          web:
            http: 127.0.0.1:5556

          telemetry:
            http: 127.0.0.1:5558

          grpc:
            addr: 127.0.0.1:5557

          staticClients:
            - id: example-app
              redirectURIs:
                - 'http://127.0.0.1:5555/callback'
              name: 'Example App'
              secret: ZXhhbXBsZS1hcHAtc2VjcmV0

          connectors:
            - type: mockCallback
              id: mock
              name: Example

          enablePasswordDB: true

          staticPasswords:
            - email: "admin@example.com"
              hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
              username: "admin"
              name: "Admin User"
              emailVerified: true
              preferredUsername: "admin"
              groups:
                - "team-a"
                - "team-a/admins"
              userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
          oauth2:
            passwordConnector: local  
  destination:
    server: https://kubernetes.default.svc
    namespace: dex
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    automated:
      selfHeal: true
