apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp
      chart: headlamp
      targetRevision: 0.40.0
      helm:
        releaseName: headlamp
        valuesObject:
          service:
            port: 80
  destination:
    server: "https://kubernetes.default.svc"
    namespace: headlamp
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    automated:
      selfHeal: true
--- 
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: route-headlamp
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/chhayham/k3d-demo
      path: helm/ingressroute
      targetRevision: main
      helm:
        releaseName: route-headlamp
        valuesObject:
          ingressRoutes:
            - name: headlamp
              namespace: headlamp
              hostname: k8s.localhost
              entryPoints:
                - web
              services:
                - name: headlamp
                  port: 80    
  destination:
    server: "https://kubernetes.default.svc"
    namespace: headlamp
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    automated:
      selfHeal: true
