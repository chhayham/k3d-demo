apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    chart: headlamp
    repoURL: https://kubernetes-sigs.github.io/headlamp
    targetRevision: 0.40.0
    helm:
      releaseName: headlamp
      valuesObject:
        service:
          type: NodePort
          port: 80
          nodePort: 31201
  destination:
    server: "https://kubernetes.default.svc"
    namespace: headlamp
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    automated:
      selfHeal: true